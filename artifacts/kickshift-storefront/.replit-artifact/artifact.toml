kind = "web"
previewPath = "/"
title = "Kickshift Storefront"
description = "A footwear storefront to explore Kickshift shoes and build a custom colorway with live shoe previews."
version = "1.0.0"
id = "artifacts/kickshift-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25941

[services.development]
run = "pnpm --filter @workspace/kickshift-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kickshift-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/kickshift-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25941"
BASE_PATH = "/"
